# Pin the presentation so a live demo renders identically on any machine.
# The chart palette was validated against the light chart surface, so the
# theme is fixed to light rather than following the viewer's OS setting.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"

[browser]
gatherUsageStats = false

[server]
headless = true
